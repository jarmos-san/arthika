name: Client QA

on:
  pull_request:
    paths: ["client/**"]
    branches: [main]

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./client
          cache: true

      - name: Enforce Linting Rules
        run: pnpm run lint

  formatters:
    name: Formatters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./client
          cache: true

      - name: Enforce Formatting Rules
        run: pnpm run fmt:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./client
          cache: true

      - name: Run Type Check
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./client
          cache: true

      - name: Run Tests
        run: pnpm test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./client
          cache: true

      - name: Build the Project
        run: pnpm build
